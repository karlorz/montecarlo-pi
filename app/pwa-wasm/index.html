<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Pi Benchmark - WebAssembly (Multi-threaded)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        #results.visible {
            display: block;
        }

        #results h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        #results p {
            margin: 8px 0;
            color: #333;
            line-height: 1.6;
        }

        #results hr {
            margin: 15px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 20px;
        }

        .result-item {
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tech-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge-mt {
            background: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monte Carlo Pi Benchmark<span class="tech-badge">WASM</span><span class="tech-badge badge-mt">Multi-thread</span></h1>
        <p class="subtitle">Powered by Rust + WebAssembly + Web Workers</p>

        <div class="form-group">
            <label for="threads">Number of Threads:</label>
            <input type="number" id="threads" min="1" max="16" value="6">
        </div>

        <div class="form-group">
            <label for="iterations">Number of Iterations (Power of 10):</label>
            <input type="number" id="iterations" min="1" max="8" value="7">
        </div>

        <div class="form-group">
            <label for="benchmark-iterations">Benchmark Iterations:</label>
            <input type="number" id="benchmark-iterations" min="1" max="100" value="2">
        </div>

        <button id="start-button">Start Benchmark</button>

        <div id="loading" class="loading" style="display: none;">
            Running benchmark...
        </div>

        <div id="results"></div>
    </div>

    <script type="module">
        // Worker Pool for persistent WASM workers
        class WorkerPool {
            constructor(numThreads) {
                this.numThreads = numThreads;
                this.workers = [];
                this.availableWorkers = [];
                this.taskQueue = [];
            }

            async init() {
                console.log(`Initializing worker pool with ${this.numThreads} workers...`);
                const initPromises = [];

                for (let i = 0; i < this.numThreads; i++) {
                    const worker = new Worker('./wasm-worker.js', { type: 'module' });
                    this.workers.push(worker);

                    const readyPromise = new Promise((resolve) => {
                        const readyHandler = (e) => {
                            if (e.data.type === 'ready') {
                                worker.removeEventListener('message', readyHandler);
                                this.availableWorkers.push(worker);
                                resolve();
                            }
                        };
                        worker.addEventListener('message', readyHandler);
                    });

                    initPromises.push(readyPromise);
                }

                await Promise.all(initPromises);
                console.log(`Worker pool initialized (${this.numThreads} workers ready)`);
            }

            execute(iters) {
                return new Promise((resolve) => {
                    const worker = this.availableWorkers.shift();

                    const resultHandler = (e) => {
                        if (e.data.type === 'result') {
                            worker.removeEventListener('message', resultHandler);
                            this.availableWorkers.push(worker);
                            resolve(e.data.data);
                        }
                    };

                    worker.addEventListener('message', resultHandler);
                    worker.postMessage({ iters });
                });
            }

            terminate() {
                this.workers.forEach(w => w.terminate());
                this.workers = [];
                this.availableWorkers = [];
            }
        }

        async function run() {
            const startButton = document.getElementById('start-button');
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            startButton.addEventListener('click', async () => {
                const threads = parseInt(document.getElementById('threads').value, 10);
                const iterationsPower = parseInt(document.getElementById('iterations').value, 10);
                const benchmarkIterations = parseInt(document.getElementById('benchmark-iterations').value, 10);
                const totalIterations = Math.pow(10, iterationsPower);
                const itersPerThread = Math.floor(totalIterations / threads);

                resultsDiv.innerHTML = '';
                resultsDiv.classList.remove('visible');
                loadingDiv.style.display = 'block';
                startButton.disabled = true;

                try {
                    // Create worker pool ONCE before benchmarking
                    const pool = new WorkerPool(threads);
                    const poolInitStart = performance.now();
                    await pool.init();
                    const poolInitTime = performance.now() - poolInitStart;

                    let totalPi = 0;
                    let totalTime = 0;

                    resultsDiv.innerHTML = `<h2>Benchmark Results</h2>`;
                    resultsDiv.innerHTML += `<p><strong>Worker pool initialization:</strong> ${poolInitTime.toFixed(0)} ms</p><hr>`;

                    for (let run = 0; run < benchmarkIterations; run++) {
                        const startTime = performance.now();

                        // Reuse workers from pool - NO recreation overhead
                        const promises = [];
                        for (let t = 0; t < threads; t++) {
                            promises.push(pool.execute(itersPerThread));
                        }

                        // Wait for all workers to complete
                        const results = await Promise.all(promises);
                        const totalIn = results.reduce((sum, count) => sum + count, 0);
                        const actualTotal = itersPerThread * threads;
                        const pi = (4.0 * totalIn) / actualTotal;

                        const elapsedTime = performance.now() - startTime;
                        totalPi += pi;
                        totalTime += elapsedTime;

                        resultsDiv.innerHTML += `
                            <div class="result-item">
                                <p><strong>Run ${run + 1}:</strong></p>
                                <p>Pi: ${pi}</p>
                                <p>Points in circle: ${totalIn.toLocaleString()}</p>
                                <p>Total points: ${actualTotal.toLocaleString()}</p>
                                <p>Elapsed time: ${elapsedTime.toFixed(0)} ms</p>
                                <p>Threads: ${threads}</p>
                                ${run < benchmarkIterations - 1 ? '<hr>' : ''}
                            </div>
                        `;
                    }

                    // Cleanup - terminate all workers
                    pool.terminate();

                    const avgPi = totalPi / benchmarkIterations;
                    const avgTime = totalTime / benchmarkIterations;
                    const error = Math.abs(Math.PI - avgPi);
                    const errorPercent = (error / Math.PI * 100).toFixed(4);

                    resultsDiv.innerHTML += `
                        <hr>
                        <div class="result-item">
                            <h2>Average Results</h2>
                            <p><strong>Average Pi:</strong> ${avgPi}</p>
                            <p><strong>Actual Pi:</strong> ${Math.PI}</p>
                            <p><strong>Error:</strong> ${error.toFixed(8)} (${errorPercent}%)</p>
                            <p><strong>Average time:</strong> ${avgTime.toFixed(0)} ms</p>
                            <p><strong>Pool init time (one-time):</strong> ${poolInitTime.toFixed(0)} ms</p>
                            <p><strong>Threads:</strong> ${threads}</p>
                            <p><strong>Iterations per thread:</strong> ${itersPerThread.toLocaleString()}</p>
                            <p><strong>Total iterations per run:</strong> ${(itersPerThread * threads).toLocaleString()}</p>
                        </div>
                    `;

                    resultsDiv.classList.add('visible');
                } catch (error) {
                    resultsDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                    resultsDiv.classList.add('visible');
                    console.error('Benchmark error:', error);
                } finally {
                    loadingDiv.style.display = 'none';
                    startButton.disabled = false;
                }
            });

            console.log('Multi-threaded WebAssembly ready (with worker pool)!');
        }

        run().catch(console.error);
    </script>
</body>
</html>
